---
apiVersion: v1
kind: Namespace
metadata:
  name: gap-miner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gap-miner-data
  namespace: gap-miner
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gap-miner
  namespace: gap-miner
spec:
  schedule: "37 */4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: gap-miner
              image: gap-miner-langraph:0.1.0
              imagePullPolicy: Never
              env:
                - name: LLM_CHAT_URL
                  value: "https://rile.cc/v1/prod1/v1/chat/completions"
                - name: LLM_MODEL
                  value: "qwen38"
                - name: DATA_DIR
                  value: "/data"
                - name: BEARER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gateway-bearer
                      key: BEARER_TOKEN
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests: {memory: "128Mi", cpu: "100m"}
                limits: {memory: "768Mi", cpu: "500m"}
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: gap-miner-data
